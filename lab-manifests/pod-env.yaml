apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-env-overrides
  namespace: default
data:
  USE_WALG_BACKUP: "true"
  USE_WALG_RESTORE: "true"
  AWS_ENDPOINT: http://minio.default.svc:9000
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  WALG_DISABLE_S3_SSE: "true"
  BACKUP_SCHEDULE: "*/15 * * * *"
  BACKUP_NUM_TO_RETAIN: "5"
  CLONE_USE_WALG_RESTORE: "true"
  CLONE_AWS_ENDPOINT: http://minio.default.svc:9000
  CLONE_AWS_S3_FORCE_PATH_STYLE: "true"
  CLONE_AWS_REGION: us-east-1
  CLONE_AWS_ACCESS_KEY_ID: minioadmin
  CLONE_AWS_SECRET_ACCESS_KEY: minioadmin